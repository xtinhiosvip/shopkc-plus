<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShopKCPlus.vn · Vòng quay kim cương</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0b0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        /* ===== AUTH ===== */
        #authScreen {
            position: fixed;
            inset: 0;
            background: rgba(8,12,20,0.97);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #authScreen.hidden { opacity: 0; pointer-events: none; }
        .auth-box {
            background: #161c27;
            padding: 40px 30px;
            border-radius: 48px;
            border: 1px solid #2d3748;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .auth-box h2 { color: #f5c542; font-size: 26px; letter-spacing: 1px; margin-bottom: 6px; }
        .auth-box p { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
        .auth-box input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 60px;
            border: 2px solid #2d3748;
            background: #0b0e14;
            color: #f0f6fc;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 12px;
        }
        .auth-box input:focus { border-color: #f5c542; }
        .auth-box .btn-auth {
            background: #f5c542;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 800;
            color: #0b0e14;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 5px 0 #a07d2a;
            transition: 0.08s linear;
            margin-bottom: 10px;
        }
        .auth-box .btn-auth:active { transform: translateY(4px); box-shadow: 0 1px 0 #a07d2a; }
        .auth-box .btn-auth.secondary {
            background: #2d3748;
            color: #c9d1d9;
            box-shadow: 0 4px 0 #1a1f2b;
            font-size: 15px;
        }
        .auth-box .error { color: #f87171; font-size: 14px; min-height: 22px; }

        /* ===== APP ===== */
        #app {
            width: 100%;
            max-width: 480px;
            background: #131a24;
            border-radius: 40px 40px 28px 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 0 1px #2a3442;
            border: 1px solid #1e2633;
            overflow: hidden;
            display: none;
        }
        #app.active { display: block; }

        /* HEADER */
        .header {
            padding: 16px 20px;
            background: #0b0e14;
            border-bottom: 1px solid #1e2633;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header .brand {
            color: #f5c542;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .header .brand small { color: #6a7b94; font-weight: 400; font-size: 11px; }
        .header .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e2633;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 14px;
            color: #f0f6fc;
        }
        .header .user-badge .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5c542, #f39c12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #0b0e14;
        }
        .header .balance-badge {
            color: #4ade80;
            font-weight: 700;
            font-size: 15px;
            background: #1a2a1a;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #4ade8066;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* MENU */
        .menu {
            display: flex;
            gap: 4px;
            padding: 10px 16px;
            background: #0b0e14;
            border-bottom: 1px solid #1e2633;
            flex-wrap: wrap;
        }
        .menu .item {
            padding: 8px 16px;
            border-radius: 30px;
            background: #1e2633;
            color: #8b949e;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }
        .menu .item.active {
            background: #f5c542;
            color: #0b0e14;
            border-color: #f5c542;
        }
        .menu .item:active { transform: scale(0.95); }

        /* PAGES */
        .page { display: none; padding: 20px; }
        .page.active { display: block; }

        /* ===== WHEEL ===== */
        .wheel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            max-width: 100%;
        }
        .wheel-container canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 0 6px #2d3545, 0 0 0 10px #1b212b, 0 12px 40px #000000cc;
            cursor: pointer;
        }
        .wheel-container .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            color: #ff3333;
            text-shadow: 0 4px 0 #990000, 0 8px 12px black;
            z-index: 10;
            line-height: 1;
        }
        .spin-btn {
            padding: 14px 50px;
            border: none;
            border-radius: 60px;
            background: #f5c542;
            color: #0b0e14;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 0 #a07d2a;
            transition: 0.08s linear;
        }
        .spin-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #a07d2a; }
        .spin-btn:disabled { opacity: 0.5; pointer-events: none; transform: translateY(3px); box-shadow: 0 1px 0 #a07d2a; }
        .spin-info {
            display: flex;
            gap: 18px;
            color: #8b949e;
            font-size: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .spin-info span { color: #f5c542; font-weight: 700; }
        .spin-result {
            text-align: center;
            padding: 12px;
            border-radius: 20px;
            background: #0b0e14;
            border: 1px solid #1e2633;
            color: #6a7b94;
            font-size: 14px;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .spin-result.win { color: #4ade80; border-color: #4ade8066; background: #1a2a1a; font-weight: 700; }

        /* ===== NẠP THẺ ===== */
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            color: #c9d1d9;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 60px;
            border: 2px solid #2d3748;
            background: #0b0e14;
            color: #f0f6fc;
            font-size: 15px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: #f5c542; }
        .form-group select option { background: #0b0e14; }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 60px;
            background: #f5c542;
            color: #0b0e14;
            font-weight: 800;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 4px 0 #a07d2a;
            transition: 0.08s;
            margin-top: 6px;
        }
        .btn-submit:active { transform: translateY(3px); box-shadow: 0 1px 0 #a07d2a; }
        .note { color: #6a7b94; font-size: 12px; text-align: center; margin-top: 10px; }

        /* ===== RÚT KC ===== */
        .withdraw-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 12px 0;
        }
        .withdraw-btn {
            padding: 12px 24px;
            border-radius: 40px;
            border: 2px solid #2d3748;
            background: #0b0e14;
            color: #c9d1d9;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.1s;
        }
        .withdraw-btn:active { transform: scale(0.95); }
        .withdraw-btn.active {
            background: #f5c542;
            color: #0b0e14;
            border-color: #f5c542;
        }
        .withdraw-info {
            display: flex;
            justify-content: space-between;
            color: #8b949e;
            font-size: 13px;
            padding: 6px 4px;
        }
        .withdraw-info span { color: #f5c542; font-weight: 700; }
        .withdraw-result {
            text-align: center;
            padding: 10px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 10px;
            min-height: 44px;
        }
        .withdraw-result.success { color: #4ade80; background: #1a2a1a; }
        .withdraw-result.error { color: #f87171; background: #2a1a1a; }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: #f0f6fc;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 9999;
            font-size: 14px;
            border: 1px solid #374151;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 420px) {
            .wheel-container { width: 260px; height: 260px; }
            .header .brand { font-size: 17px; }
        }
    </style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
    <div class="auth-box">
        <h2>💎 SHOPKC PLUS</h2>
        <p>Đăng nhập hoặc tạo tài khoản</p>
        <input type="text" id="usernameInput" placeholder="Tên tài khoản" autofocus>
        <input type="password" id="passwordInput" placeholder="Mật khẩu">
        <button class="btn-auth" id="loginBtn">🔑 ĐĂNG NHẬP</button>
        <button class="btn-auth secondary" id="registerBtn">✨ TẠO TÀI KHOẢN</button>
        <div class="error" id="authError"></div>
    </div>
</div>

<!-- APP -->
<div id="app">
    <div class="header">
        <span class="brand">💎 SHOPKC <small>PLUS.VN</small></span>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <div class="user-badge">
                <div class="avatar" id="userAvatar">U</div>
                <span id="userNameDisplay">User</span>
            </div>
            <div class="balance-badge">💎 <span id="balanceDisplay">0</span> KC</div>
        </div>
    </div>

    <div class="menu">
        <div class="item active" data-page="wheel">🎡 Vòng quay</div>
        <div class="item" data-page="recharge">💳 Nạp thẻ</div>
        <div class="item" data-page="withdraw">📤 Rút KC</div>
    </div>

    <!-- WHEEL PAGE -->
    <div class="page active" id="page-wheel">
        <div class="wheel-wrapper">
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
                <div class="pointer">▼</div>
            </div>
            <button class="spin-btn" id="spinBtn">🎡 QUAY (Miễn phí)</button>
            <div class="spin-info">
                <div>Lượt quay: <span id="spinCountDisplay">10</span></div>
                <div>Đã nhận: <span id="totalWonDisplay">0</span> KC</div>
            </div>
            <div class="spin-result" id="spinResultBox">💎 Nhấn QUAY để nhận kim cương!</div>
        </div>
    </div>

    <!-- RECHARGE PAGE -->
    <div class="page" id="page-recharge">
        <div class="form-group">
            <label>💰 Mệnh giá</label>
            <select id="amountSelect">
                <option value="10.000">10.000 VND</option>
                <option value="20.000">20.000 VND</option>
                <option value="50.000" selected>50.000 VND</option>
                <option value="100.000">100.000 VND</option>
                <option value="200.000">200.000 VND</option>
                <option value="500.000">500.000 VND</option>
                <option value="1.000.000">1.000.000 VND</option>
            </select>
        </div>
        <div class="form-group">
            <label>🏦 Loại thẻ</label>
            <select id="cardTypeSelect">
                <option value="Viettel">Viettel</option>
                <option value="Mobifone">Mobifone</option>
                <option value="Vinaphone">Vinaphone</option>
                <option value="Vietnamobile">Vietnamobile</option>
                <option value="Garena">Garena</option>
            </select>
        </div>
        <div class="form-group">
            <label>🔢 Số seri</label>
            <input type="text" id="seriInput" placeholder="Nhập số seri ...">
        </div>
        <div class="form-group">
            <label>🔑 Mã thẻ</label>
            <input type="text" id="codeInput" placeholder="Nhập mã thẻ ...">
        </div>
        <button class="btn-submit" id="sendCardBtn">📨 GỬI NGAY</button>
        <div class="note">Thông tin sẽ được gửi qua Gmail: xtinhdz8@gmail.com</div>
    </div>

    <!-- WITHDRAW PAGE -->
    <div class="page" id="page-withdraw">
        <div style="color:#c9d1d9; font-weight:600; margin-bottom:8px;">💎 Chọn mệnh giá rút:</div>
        <div class="withdraw-options" id="withdrawOptions">
            <button class="withdraw-btn" data-value="113">113 KC</button>
            <button class="withdraw-btn" data-value="283">283 KC</button>
            <button class="withdraw-btn" data-value="566">566 KC</button>
            <button class="withdraw-btn" data-value="2830">2.830 KC</button>
        </div>
        <div class="withdraw-info">
            <span>Số dư khả dụng: <span id="withdrawBalance">0</span> KC</span>
            <span>Đã chọn: <span id="withdrawSelected">0</span> KC</span>
        </div>
        <div class="form-group">
            <label>🆔 ID người nhận</label>
            <input type="text" id="withdrawIdInput" placeholder="Nhập ID tài khoản game ...">
        </div>
        <button class="btn-submit" id="withdrawBtn">📤 RÚT NGAY</button>
        <div class="withdraw-result" id="withdrawResultBox"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    (function() {
        'use strict';

        // ===== STATE =====
        let currentUser = null;
        let balance = 0;
        let spinCount = 10;
        let totalWon = 0;
        let selectedWithdraw = 0;
        let isSpinning = false;
        let currentAngle = 0;

        // ===== WHEEL SEGMENTS =====
        const SEGMENTS = [
            { label: '10',   color: '#e74c3c' },
            { label: '50',   color: '#f39c12' },
            { label: '100',  color: '#2ecc71' },
            { label: '5',    color: '#3498db' },
            { label: '500',  color: '#9b59b6' },
            { label: '20',   color: '#1abc9c' },
            { label: '200',  color: '#e67e22' },
            { label: '1000', color: '#e84393' },
            { label: '30',   color: '#00b894' },
            { label: '300',  color: '#636e72' }
        ];
        const SEG_COUNT = SEGMENTS.length;
        const ARC = (2 * Math.PI) / SEG_COUNT;

        // ===== DOM =====
        const authScreen = document.getElementById('authScreen');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const authError = document.getElementById('authError');

        const app = document.getElementById('app');
        const userAvatar = document.getElementById('userAvatar');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const balanceDisplay = document.getElementById('balanceDisplay');

        const menuItems = document.querySelectorAll('.menu .item');
        const pages = {
            wheel: document.getElementById('page-wheel'),
            recharge: document.getElementById('page-recharge'),
            withdraw: document.getElementById('page-withdraw')
        };

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const spinCountDisplay = document.getElementById('spinCountDisplay');
        const totalWonDisplay = document.getElementById('totalWonDisplay');
        const spinResultBox = document.getElementById('spinResultBox');

        const sendCardBtn = document.getElementById('sendCardBtn');
        const amountSelect = document.getElementById('amountSelect');
        const cardTypeSelect = document.getElementById('cardTypeSelect');
        const seriInput = document.getElementById('seriInput');
        const codeInput = document.getElementById('codeInput');

        const withdrawOptions = document.getElementById('withdrawOptions');
        const withdrawBalance = document.getElementById('withdrawBalance');
        const withdrawSelected = document.getElementById('withdrawSelected');
        const withdrawIdInput = document.getElementById('withdrawIdInput');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const withdrawResultBox = document.getElementById('withdrawResultBox');

        const toast = document.getElementById('toast');

        // ===== TOAST =====
        let toastTimer = null;
        function showToast(msg, duration = 2000) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ===== UPDATE BALANCE =====
        function updateBalance() {
            balanceDisplay.textContent = balance.toLocaleString('vi-VN');
            withdrawBalance.textContent = balance.toLocaleString('vi-VN');
        }

        // ===== DRAW WHEEL =====
        function drawWheel(angle) {
            const cx = 300, cy = 300, r = 280;
            ctx.clearRect(0, 0, 600, 600);
            for (let i = 0; i < SEG_COUNT; i++) {
                const start = i * ARC + angle;
                const end = start + ARC;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, end);
                ctx.closePath();
                ctx.fillStyle = SEGMENTS[i].color;
                ctx.fill();
                ctx.strokeStyle = '#1a1f2b';
                ctx.lineWidth = 3;
                ctx.stroke();

                const mid = start + ARC / 2;
                const textR = r * 0.68;
                const tx = cx + Math.cos(mid) * textR;
                const ty = cy + Math.sin(mid) * textR;
                ctx.save();
                ctx.translate(tx, ty);
                ctx.rotate(mid + (mid > Math.PI/2 ? Math.PI : 0));
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 8;
                ctx.fillText(SEGMENTS[i].label, 0, 0);
                ctx.restore();
            }
            // center
            ctx.beginPath();
            ctx.arc(cx, cy, 34, 0, 2 * Math.PI);
            ctx.fillStyle = '#1e2530';
            ctx.fill();
            ctx.strokeStyle = '#f5c542';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd966';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💎', cx, cy);
        }

        // ===== SPIN =====
        function spinWheel() {
            if (isSpinning) return;
            if (spinCount <= 0) {
                showToast('⚠️ Bạn đã hết lượt quay miễn phí!', 2000);
                return;
            }
            isSpinning = true;
            spinBtn.disabled = true;
            spinResultBox.className = 'spin-result';
            spinResultBox.textContent = '🎲 Đang quay...';

            const extraSpins = 5 + Math.random() * 4;
            const targetSegment = Math.floor(Math.random() * SEG_COUNT);
            const stopAngle = -(targetSegment * ARC + ARC / 2) + Math.PI / 2 + 2 * Math.PI * extraSpins;
            const startAngle = currentAngle;
            const totalRotation = stopAngle - startAngle;
            const duration = 3500 + Math.random() * 800;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + totalRotation * ease;
                drawWheel(currentAngle);
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = stopAngle;
                    drawWheel(stopAngle);
                    const winValue = parseInt(SEGMENTS[targetSegment].label, 10);
                    balance += winValue;
                    totalWon += winValue;
                    spinCount--;
                    updateBalance();
                    spinCountDisplay.textContent = spinCount;
                    totalWonDisplay.textContent = totalWon.toLocaleString('vi-VN');
                    spinResultBox.className = 'spin-result win';
                    spinResultBox.innerHTML = `💎 Bạn nhận được <strong>${winValue} KC</strong>! Tổng: ${totalWon.toLocaleString('vi-VN')} KC`;
                    isSpinning = false;
                    spinBtn.disabled = false;
                    showToast(`💎 +${winValue} KC`, 1500);
                }
            }
            requestAnimationFrame(animate);
        }

        // ===== MENU =====
        menuItems.forEach(item => {
            item.addEventListener('click', function() {
                menuItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                const page = this.dataset.page;
                Object.keys(pages).forEach(key => {
                    pages[key].classList.toggle('active', key === page);
                });
            });
        });

        // ===== RECHARGE =====
        sendCardBtn.addEventListener('click', function() {
            const amount = amountSelect.value;
            const cardType = cardTypeSelect.value;
            const seri = seriInput.value.trim();
            const code = codeInput.value.trim();

            if (!seri || !code) {
                showToast('⚠️ Vui lòng nhập đầy đủ số seri và mã thẻ!', 2000);
                return;
            }

            const subject = encodeURIComponent(`[NẠP THẺ] ${cardType} - ${amount} VND`);
            const body = encodeURIComponent(
                `Thông tin nạp thẻ:\n\n` +
                `Loại thẻ: ${cardType}\n` +
                `Mệnh giá: ${amount} VND\n` +
                `Số seri: ${seri}\n` +
                `Mã thẻ: ${code}\n\n` +
                `---\nGửi từ ShopKCPlus.vn`
            );
            const mailtoLink = `mailto:xtinhdz8@gmail.com?subject=${subject}&body=${body}`;
            window.location.href = mailtoLink;
            showToast('📨 Đang mở Gmail ...', 2000);
        });

        // ===== WITHDRAW =====
        withdrawOptions.querySelectorAll('.withdraw-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                withdrawOptions.querySelectorAll('.withdraw-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedWithdraw = parseInt(this.dataset.value, 10);
                withdrawSelected.textContent = selectedWithdraw.toLocaleString('vi-VN');
            });
        });

        withdrawBtn.addEventListener('click', function() {
            if (selectedWithdraw <= 0) {
                showToast('⚠️ Vui lòng chọn mệnh giá rút!', 1500);
                return;
            }
            if (balance < selectedWithdraw) {
                showToast('⚠️ Số dư không đủ!', 1500);
                return;
            }
            const id = withdrawIdInput.value.trim();
            if (!id) {
                showToast('⚠️ Vui lòng nhập ID người nhận!', 1500);
                return;
            }
            balance -= selectedWithdraw;
            updateBalance();
            withdrawResultBox.className = 'withdraw-result success';
            withdrawResultBox.textContent = `✅ Rút thành công ${selectedWithdraw.toLocaleString('vi-VN')} KC đến ID: ${id}`;
            showToast(`📤 Đã rút ${selectedWithdraw.toLocaleString('vi-VN')} KC`, 2000);
            selectedWithdraw = 0;
            withdrawSelected.textContent = '0';
            withdrawOptions.querySelectorAll('.withdraw-btn').forEach(b => b.classList.remove('active'));
            withdrawIdInput.value = '';
        });

        // ===== AUTH =====
        function handleLogin() {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();
            if (!user || !pass) {
                authError.textContent = '⚠️ Vui lòng nhập tên và mật khẩu!';
                return;
            }
            // Lưu tài khoản (đơn giản)
            const stored = localStorage.getItem('shopkc_users');
            let users = stored ? JSON.parse(stored) : {};
            if (users[user] && users[user] !== pass) {
                authError.textContent = '❌ Sai mật khẩu!';
                return;
            }
            if (!users[user]) {
                users[user] = pass;
                localStorage.setItem('shopkc_users', JSON.stringify(users));
            }
            currentUser = user;
            authScreen.classList.add('hidden');
            app.classList.add('active');
            userAvatar.textContent = user.charAt(0).toUpperCase();
            userNameDisplay.textContent = user;
            authError.textContent = '';
            updateBalance();
            spinCountDisplay.textContent = spinCount;
            totalWonDisplay.textContent = '0';
            drawWheel(currentAngle);
            showToast(`🎉 Chào mừng ${user}!`, 2000);
        }

        function handleRegister() {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();
            if (!user || !pass) {
                authError.textContent = '⚠️ Vui lòng nhập tên và mật khẩu!';
                return;
            }
            const stored = localStorage.getItem('shopkc_users');
            let users = stored ? JSON.parse(stored) : {};
            if (users[user]) {
                authError.textContent = '❌ Tài khoản đã tồn tại!';
                return;
            }
            users[user] = pass;
            localStorage.setItem('shopkc_users', JSON.stringify(users));
            authError.textContent = '';
            handleLogin();
        }

        loginBtn.addEventListener('click', handleLogin);
        registerBtn.addEventListener('click', handleRegister);

        // ===== INIT =====
        drawWheel(currentAngle);
        updateBalance();

        // Enter để đăng nhập
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
        usernameInput.focus();

        console.log('[ShopKCPlus] Đã sẵn sàng.');
    })();
</script>
</body>
</html>
